        q: "磁界 $B$ の中で、面積 $S$・巻数 $N$ のコイルを角速度 $\\omega$ で等速回転させるときに発生する「最大誘導起電力 $E_m$」を表す公式は？",
        options: ["$E_m = N B S \\omega$", "$E_m = \\frac{N B S}{\\omega}$", "$E_m = \\frac{B S \\omega}{N}$", "$E_m = 2\\pi N B S \\omega$"],
        answer: 0,
        exp: "【解説】\n交流発電の基本公式です。最大電圧は全要素を掛け合わせた形になります：\n$$E_m = N B S \\omega$$"
    }
];

let currentIdx = 0;
let score = 0;
let answered = false;

function loadQuestion() {
    answered = false;
    const q = quizData[currentIdx];
    document.getElementById("progress").innerText = `問題 ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById("question").innerText = `[問${currentIdx + 1}]\n${q.q}`;
    
    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = `${index + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
    });

    document.getElementById("explanation").style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    // MathJaxの再レンダリング実行
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

function checkAnswer(selectedIndex) {
    if (answered) return;
    answered = true;

    const q = quizData[currentIdx];
    const buttons = document.querySelectorAll(".option-btn");

    if (selectedIndex === q.answer) {
        buttons[selectedIndex].classList.add("correct");
        score++;
    } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
    }

    document.getElementById("explanation-text").innerText = q.exp;
    document.getElementById("explanation").style.display = "block";
    document.getElementById("next-btn").style.display = "block";

    // 解説が表示された後にMathJaxを呼び出し数式化する
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

function nextQuestion() {
    currentIdx++;
    if (currentIdx < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("result-score").innerText = `${score} / ${quizData.length} 点`;
}

function restartQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    loadQuestion();
}

// アプリ起動時に1問目を読み込む
loadQuestion();
</script>
